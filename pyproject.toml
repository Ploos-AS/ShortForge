[project]
name = "shortforge"
version = "0.1.0"
description = "AI-assisted short-form video pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
shortforge = "shortforge_cli:main"

[tool.setuptools]
py-modules = ["shortforge_cli", "shortforge_providers", "shortforge_profiles", "shortforge_storyboard", "shortforge_assets", "shortforge_workspace", "shortforge_media", "shortforge_render", "shortforge_qualify", "shortforge_production", "shortforge_publish", "shortforge_publishers", "shortforge_youtube"]
