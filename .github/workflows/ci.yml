name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          shortforge validate examples/retro-gag/project.yaml
          shortforge score examples/retro-gag/project.yaml
          shortforge variants examples/retro-gag/variants.yaml
          shortforge select examples/retro-gag/variants.yaml
          shortforge generate "Amiga 9000 launch" --count 3 > /tmp/generated.yaml
          shortforge select /tmp/generated.yaml
